name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # releases + gh-pages branch (apt repo state)

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Devices built by CI update from this repo's GitHub Pages apt repository.
  APT_REPO_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
  # Armored private key (gpg --export-secret-keys --armor). Without it, a
  # throwaway key is generated and published repos cannot be updated safely.
  APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # package versions use the commit count

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Firmware (TF-A, OP-TEE, U-Boot)
        run: make firmware

      - name: Kernel
        run: make kernel

      - name: Packages
        run: make packages

      - name: Root filesystem and SD image
        run: make image

      - uses: actions/upload-artifact@v4
        with:
          name: coremp135-image
          path: |
            build/out/*.img.xz
            build/out/firmware/
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: coremp135-debs
          path: build/out/debs/*.deb

      - name: Fetch current apt repository (gh-pages)
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && env.APT_SIGNING_KEY != ''
        run: |
          git fetch origin gh-pages:gh-pages 2>/dev/null && git worktree add build/repo gh-pages || mkdir -p build/repo

      - name: Publish apt repository
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && env.APT_SIGNING_KEY != ''
        env:
          REPO_DIR: /work/build/repo
        run: |
          scripts/docker-run.sh scripts/publish-repo.sh
          cd build/repo
          git init -q 2>/dev/null || true
          git checkout -q -B gh-pages
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
              commit -q -m "apt repo: ${GITHUB_SHA::8}" || exit 0
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages

      - name: Upload apt repository for GitHub Pages
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && env.APT_SIGNING_KEY != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/repo

      # Every push to main gets a release "build-YYYYMMDD-<sha>" with the
      # image, the boot firmware and checksums; a vX.Y tag gets a release under
      # its own name. Only the newest KEEP_BUILDS automatic releases are kept;
      # v* releases are never pruned.
      - name: Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_BUILDS: 10
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME; title="$tag"; create_args=(--verify-tag)
          else
            tag="build-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
            title="Build $(date -u +%F) (${GITHUB_SHA::7})"
            create_args=(--target "$GITHUB_SHA")
          fi

          rel=build/release; rm -rf "$rel"; mkdir -p "$rel"
          for f in build/out/*.img.xz; do cp "$f" "$rel/${tag}-$(basename "$f" | sed 's/-[0-9]\{8\}\.img\.xz$/.img.xz/')"; done
          cp build/out/firmware/tf-a-stm32mp135f-coremp135.stm32 build/out/firmware/fip.bin "$rel/"
          (cd "$rel" && sha256sum * > sha256sums)

          # Notes: package versions and the commits since the previous release
          prev=$(git describe --tags --abbrev=0 --match 'build-*' --match 'v*' \
                 --exclude "$tag" HEAD 2>/dev/null || true)
          {
            echo "Flash \`${tag}-*.img.xz\` to a microSD card, see [FLASHING.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/FLASHING.md)."
            echo "Running devices get the same packages with \`sudo apt update && sudo apt full-upgrade\`."
            echo
            echo "| Package | Version |"
            echo "|---|---|"
            for d in build/out/debs/*.deb; do
              echo "| \`$(dpkg-deb -f "$d" Package)\` | $(dpkg-deb -f "$d" Version) |"
            done
            echo
            if [ -n "$prev" ]; then
              echo "### Changes since $prev"
              git log --no-merges --format='- %s (%h)' "$prev..HEAD"
            else
              echo "### Changes"
              git log --no-merges --format='- %s (%h)' -n 20
            fi
          } > "$rel/notes.md"

          gh release create "$tag" "${create_args[@]}" --title "$title" \
            --notes-file "$rel/notes.md" --latest \
            "$rel"/*.img.xz "$rel"/*.stm32 "$rel"/fip.bin "$rel"/sha256sums

          # Prune old automatic releases (and their tags)
          gh release list --limit 1000 --json tagName,createdAt \
              --jq '[.[] | select(.tagName | startswith("build-"))] | sort_by(.createdAt) | reverse | .[].tagName' |
            tail -n +"$((KEEP_BUILDS + 1))" |
            while read -r old; do
              echo "pruning $old"
              gh release delete "$old" --cleanup-tag --yes
            done

  # The gh-pages branch stores the reprepro state between runs; the site
  # itself is deployed from the uploaded artifact (Pages source: GitHub Actions).
  pages:
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
